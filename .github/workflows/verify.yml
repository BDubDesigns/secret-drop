name: Verify shh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run test suite
        run: python -m pytest

  container-e2e:
    name: Docker image and container handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install E2E test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build image
        run: docker build --tag shh:ci .
      - name: Start image with persistent data mount
        run: |
          mkdir -p "$RUNNER_TEMP/shh-data"
          docker run --detach --name shh \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:8899:8899 \
            --volume "$RUNNER_TEMP/shh-data:/app/data" \
            shh:ci
      - name: Verify container health endpoint
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --silent --show-error http://127.0.0.1:8899/healthz || true)"
            if [ "$response" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 1
          done
          echo "container health endpoint did not become ready"
          exit 1
      - name: Run browser to receiver handoff against container
        env:
          SHH_RELAY_URL: http://127.0.0.1:8899
          SHH_USAGE_LOG: ${{ runner.temp }}/shh-data/usage.jsonl
          SHH_TEST_PLAINTEXT: container-e2e-plaintext-must-not-appear-in-captured-output
        run: python -m pytest tests/test_browser_e2e.py -q
      - name: Show container logs after failure
        if: failure()
        env:
          SHH_TEST_PLAINTEXT: container-e2e-plaintext-must-not-appear-in-captured-output
        run: |
          logs="$(docker logs shh 2>&1 || true)"
          if [[ "$logs" == *"$SHH_TEST_PLAINTEXT"* ]]; then
            echo "container logs contained test plaintext; logs withheld"
            exit 1
          fi
          printf '%s\n' "$logs"
      - name: Remove test container
        if: always()
        run: docker rm --force shh || true
